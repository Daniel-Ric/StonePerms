name: Automated Version Release

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "src/endstone_stoneperms/version.py"
      - "api/package.json"
      - "dashboard/package.json"
  workflow_dispatch:

permissions: {}

concurrency:
  group: automated-version-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.actor != 'github-actions[bot]' &&
          github.actor != 'dependabot[bot]'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.tag.outputs.exists }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install plugin build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" twine

      - name: Verify synchronized versions
        id: version
        run: python .github/scripts/check-version.py

      - name: Check whether tag exists
        id: tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --quiet --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "${RELEASE_TAG} already exists; publication jobs will be skipped."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Lint plugin
        run: python -m ruff check src tests

      - name: Test plugin
        run: python -m unittest discover -s tests -v

      - name: Build plugin distributions
        run: python -m build

      - name: Validate plugin distributions
        run: python -m twine check dist/*

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            dashboard/package-lock.json

      - name: Install and check dashboard
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm run check

      - name: Install and check API
        working-directory: api
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm run format:check
          npm run typecheck
          npm run build

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stoneperms-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs:
      - validate
      - container
    if: needs.validate.outputs.tag_exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: stoneperms-${{ needs.validate.outputs.version }}
          path: release-artifacts

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: >-
          gh release create "${RELEASE_TAG}" release-artifacts/*
          --repo "${GITHUB_REPOSITORY}"
          --target "${GITHUB_SHA}"
          --title "${RELEASE_TAG}"
          --generate-notes

  container:
    name: Publish Container
    needs: validate
    if: needs.validate.outputs.tag_exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.validate.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=StonePerms API
            org.opencontainers.image.description=StonePerms API, live plugin bridge, and dashboard

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=release-container
          cache-to: type=gha,mode=max,scope=release-container
          provenance: mode=max
          sbom: true
