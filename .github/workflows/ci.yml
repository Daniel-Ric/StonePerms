name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" twine

      - name: Verify synchronized versions
        run: python .github/scripts/check-version.py

      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

  mysql:
    name: MySQL storage
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: stoneperms-test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pstoneperms-test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project with MySQL support
        run: python -m pip install -e ".[dev,mysql]"

      - name: Test SQLite and MySQL storage
        env:
          STONEPERMS_TEST_MYSQL_HOST: 127.0.0.1
          STONEPERMS_TEST_MYSQL_PASSWORD: stoneperms-test
        run: python -m unittest discover -s tests -v

  web:
    name: Web (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22"
          - "24"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            dashboard/package-lock.json

      - name: Install dashboard from lockfile
        working-directory: dashboard
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Check dashboard
        working-directory: dashboard
        run: npm run check

      - name: Audit dashboard production dependencies
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=critical

      - name: Install API from lockfile
        working-directory: api
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Check API formatting
        working-directory: api
        run: npm run format:check

      - name: Type-check API
        working-directory: api
        run: npm run typecheck

      - name: Build API
        working-directory: api
        run: npm run build

      - name: Audit API production dependencies
        working-directory: api
        run: npm audit --omit=dev --audit-level=critical

  container:
    name: Container
    needs:
      - plugin
      - web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: api/Dockerfile
          push: false
          cache-from: type=gha,scope=ci-container
          cache-to: type=gha,mode=max,scope=ci-container
